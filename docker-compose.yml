services:
  tweeby:
    build:
      context: .
      dockerfile: Dockerfile
    image: tweeby:latest
    container_name: tweeby
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}

    volumes:
      # Persistent storage for downloads, media files, and subtitle cache (e.g. external SSD/HDD on Raspberry Pi)
      - ${DOWNLOAD_DIR:-./public/downloads}:/app/public/downloads
      # Persistent storage for generated ZIP / RAR archives
      - ${ARCHIVE_DIR:-./public/archives}:/app/public/archives

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
